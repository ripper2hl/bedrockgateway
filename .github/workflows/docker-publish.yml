name: CI/CD

on:
  push:
    branches:
      - master
      - main

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias (modo CI, sin alterar lockfile)
        run: npm ci

      - name: Ejecutar tests con Jest
        run: npm test

  # ─── JOB 2: Build & Push a Docker Hub ────────────────────────────────────────
  publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test          # Solo se ejecuta si el job 'test' pasó exitosamente

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # Habilita BuildKit y soporte multi-plataforma
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Autenticación con Docker Hub usando los secretos del repositorio
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Genera las etiquetas: 'latest' + SHA corto del commit para trazabilidad
      - name: Extraer metadatos para las etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/bedrockgateway
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      # Construye la imagen y la publica en Docker Hub
      - name: Build & Push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Usa la caché de GitHub Actions para acelerar builds sucesivos
          cache-from: type=gha
          cache-to: type=gha,mode=max
