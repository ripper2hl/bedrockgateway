sonar.projectKey=bedrockgateway
sonar.projectName=BedrockGateway
sonar.host.url=http://127.0.0.1:9000
# El token NO va aquí: se lee de la variable de entorno SONAR_TOKEN

sonar.sources=api,database,dns,proxy,index.js
sonar.tests=__tests__
sonar.test.inclusions=__tests__/**/*.test.js
sonar.exclusions=node_modules/**,coverage/**,__tests__/**,profiles/**,database/*.db,log.txt,servidores.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
